name: Cross-Bundler Benchmarks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      include_turbopack:
        description: Include Turbopack in the benchmark run
        type: boolean
        default: true
        required: false

env:
  DEFAULT_BENCHMARK_BUNDLERS: unpack,webpack,rspack,rolldown,metro,parcel,turbopack
  NO_TURBOPACK_BENCHMARK_BUNDLERS: unpack,webpack,rspack,rolldown,metro,parcel
  TURBOPACK_CLI_RELEASE_URL: https://github.com/hardfist/bundler-diff/releases/download/turbopack-cli-main/turbopack-cli-linux-x64.tar.gz

jobs:
  cross-bundler-benchmarks:
    name: Run cross-bundler benchmarks
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: moonrepo/setup-rust@v0
        with:
          channel: stable
          cache-target: release

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Unpack JavaScript API
        env:
          UNPACK_NATIVE_PROFILE: release
        run: pnpm --filter @unpack-js/core build

      - name: Download Turbopack CLI release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.include_turbopack }}
        run: |
          set -euo pipefail
          mkdir -p .benchmark-tools/turbopack-cli
          curl -fsSL "$TURBOPACK_CLI_RELEASE_URL" -o .benchmark-tools/turbopack-cli.tar.gz
          tar -xzf .benchmark-tools/turbopack-cli.tar.gz -C .benchmark-tools/turbopack-cli
          chmod +x .benchmark-tools/turbopack-cli/turbopack-cli
          .benchmark-tools/turbopack-cli/turbopack-cli --help >/dev/null

      - name: Run cross-bundler benchmark
        id: benchmark
        continue-on-error: true
        env:
          INCLUDE_TURBOPACK: ${{ github.event_name != 'workflow_dispatch' || inputs.include_turbopack }}
        run: |
          mkdir -p .benchmark-work/ci

          benchmark_bundlers="$DEFAULT_BENCHMARK_BUNDLERS"
          turbopack_args=()
          if [ "$INCLUDE_TURBOPACK" != "true" ]; then
            benchmark_bundlers="$NO_TURBOPACK_BENCHMARK_BUNDLERS"
          fi
          if [ "$INCLUDE_TURBOPACK" = "true" ]; then
            turbopack_commit="turbopack-cli-main"
            if [ -f .benchmark-tools/turbopack-cli/source-commit.txt ]; then
              turbopack_commit="$(cat .benchmark-tools/turbopack-cli/source-commit.txt)"
            fi
            turbopack_args=(
              --turbopack-binary .benchmark-tools/turbopack-cli/turbopack-cli
              --turbopack-commit "$turbopack_commit"
            )
          fi

          pnpm --filter @unpack-js/benchmarks bench -- \
            --workspace .benchmark-work/ci \
            --fixtures large,loader \
            --output-json .benchmark-work/ci/results.json \
            --summary-md .benchmark-work/ci/summary.md \
            --bundlers "$benchmark_bundlers" \
            "${turbopack_args[@]}" \
            2> >(tee .benchmark-work/ci/bundler-phase-timings.log | sed -E '/^\[(unpack|webpack) tracing\]/d; /(^| )TRACE .*: .*: close time\.busy=/d' >&2)

      - name: Format bundler phase timing summary
        if: always()
        run: |
          mkdir -p .benchmark-work/ci
          node packages/benchmarks/src/tracing-summary.mjs \
            .benchmark-work/ci/bundler-phase-timings.log \
            .benchmark-work/ci/bundler-phase-timings.md \
            --fixture large

      - name: Publish benchmark summary
        if: always()
        run: |
          if [ -f .benchmark-work/ci/summary.md ]; then
            cat .benchmark-work/ci/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Cross-Bundler Benchmarks"
              echo
              echo "The benchmark did not produce a summary. Check the workflow logs for setup or runner failures."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comment benchmark summary on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker="<!-- unpack-cross-bundler-benchmark -->"
          comment_file=".benchmark-work/ci/pr-comment.md"
          mkdir -p "$(dirname "$comment_file")"

          {
            echo "$marker"
            echo "## Cross-Bundler Benchmark"
            echo
            if [ -f .benchmark-work/ci/summary.md ]; then
              cat .benchmark-work/ci/summary.md
            else
              echo "The benchmark did not produce a summary. Check the workflow logs for setup or runner failures."
            fi
            echo
            echo "[Workflow run]($RUN_URL)"
            echo
            echo "Raw JSON results are uploaded as the \`cross-bundler-benchmark-results\` workflow artifact."
          } > "$comment_file"

          comment_id="$(
            gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" --paginate \
              --jq ".[] | select(.user.type == \"Bot\" and (.body | contains(\"$marker\"))) | .id" \
              | head -n 1
          )"

          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$comment_id" \
              -f body="$(cat "$comment_file")"
          else
            gh api --method POST "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
              -f body="$(cat "$comment_file")"
          fi

      - name: Comment bundler phase timings on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          trace_summary_file=".benchmark-work/ci/bundler-phase-timings.md"
          comment_file=".benchmark-work/ci/tracing-comment.md"
          mkdir -p "$(dirname "$comment_file")"

          {
            echo "## Bundler Phase Timings"
            echo
            echo "[Workflow run]($RUN_URL)"
            echo
            if [ -f "$trace_summary_file" ]; then
              cat "$trace_summary_file"
            else
              echo "No bundler phase timings were captured. Check the workflow logs for setup or runner failures."
            fi
          } > "$comment_file"

          gh api --method POST "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
            -f body="$(cat "$comment_file")"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-bundler-benchmark-results
          path: |
            .benchmark-work/ci/results.json
            .benchmark-work/ci/summary.md
            .benchmark-work/ci/bundler-phase-timings.log
            .benchmark-work/ci/bundler-phase-timings.md
          if-no-files-found: warn
