[workspace]
resolver = "2"
members = ["crates/unpack_core", "crates/unpack_node", "crates/unpack_paths"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/unpack-dev/unpack"

[workspace.dependencies]
brotli = "7.0.0"
dashmap = "6.1.0"
divan = { package = "codspeed-divan-compat", version = "5.0.1" }
flate2 = "1.1.9"
futures = "0.3.31"
filetime = "0.2.26"
mimalloc = { version = "0.1.48", default-features = false }
mime_guess = "2.0.5"
napi = "3.9.4"
napi-build = "2.3.2"
napi-derive = "3.5.7"
regex = "1.12.2"
rustc-hash = "2.1.1"
rspack_resolver = { version = "0.9.3", default-features = false }
rspack_sources = "0.101.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
simd-json = "0.17.0"
swc_experimental_allocator = "0.11.0"
swc_experimental_ecma_ast = "0.11.0"
swc_experimental_ecma_parser = "0.11.0"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["fs", "macros", "rt", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }

[workspace.lints.clippy]
disallowed_types = "deny"
