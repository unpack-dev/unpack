[package]
name = "turbo-persistence"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/vercel/next.js"
readme = "README.md"
publish = false
autobins = false

[features]
default = []
verify_sst_content = []
strict_checks = []
stats = ["quick_cache/stats"]
print_stats = ["stats"]
verbose_log = []

[dependencies]
anyhow = "1.0.100"
bitfield = "0.19.4"
byteorder = "1.5.0"
crc32fast = "1.5.0"
dashmap = "6.1.0"
either = "1.15.0"
fs-err = "3.1.1"
jiff = { version = "0.2.10", features = ["serde"] }
lzzzz = "2.0.0"
memmap2 = "0.9.5"
nohash-hasher = "0.2.0"
once_cell = "1.21.3"
parking_lot = "0.12.1"
postcard = { version = "1.0.4", features = ["alloc", "use-std"] }
qfilter = { version = "=0.3.0-alpha.4", features = ["serde", "legacy_x86_64_support"] }
quick_cache = "0.6.14"
rustc-hash = "2.1.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
smallvec = { version = "1.15.1", features = ["serde", "const_generics", "union", "const_new", "impl_bincode"] }
thread_local = "1.1.8"
tracing = "0.1.44"
xxhash-rust = { version = "0.8.12", features = ["xxh3"] }
zerocopy = { version = "0.8", features = ["derive"] }

[dev-dependencies]
rand = "0.10.1"
rayon = "1.10.0"
tempfile = "3.20.0"
